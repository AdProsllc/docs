  "US Hispanic / bilingual": "Hispano de EE.UU. / bilingüe",
  "18.7% of the population, 6% of ad investment. Medellín bench is a structural moat.": "18.7% de la población, 6% de la inversión publicitaria. El banco de Medellín es un foso estructural.",
  "Priciest creator niche to book, high-intent audience, pay-per-lead economics.": "El nicho de creadores más caro de contratar, audiencia de alta intención, economía de pago por lead.",
  "Shortlist — scored & ranked": "Lista corta — puntuada y clasificada",
  "score_note": "Puntuado 1–5 en los cinco filtros que deciden el primer vertical: defensa de tarifa (30%+ soporta un camino de 7 clientes a $1M), limpieza de atribución (¿podemos liquidar mensualmente?), velocidad a la prueba (caso de éxito en 90 días con activos existentes), capacidad de construir oferta (30–50 creadores en 60 días) y densidad de clientes (20+ prospectos idénticos). Verde ≥22 = empezar aquí. Ámbar = segunda ola o capa. Gris = expansión cuando la atribución maneje ciclos largos.",
  "Rate": "Tarifa",

  "Density": "Densidad",
  "Commission norms already run 40–80%, order-level attribution on Shopify, creators abundant, hundreds of identical $5–50M brands. Existing playbooks: Audien, Infiniwell, WINPRO.": "Las normas de comisión ya corren 40–80%, atribución a nivel de orden en Shopify, creadores abundantes, cientos de marcas idénticas de $5–50M. Playbooks existentes: Audien, Infiniwell, WINPRO.",
  "Rev-share is the native pricing and the lead is the conversion event — attribution is trivial. Slightly less repeatable across offer types.": "El reparto de ingresos es el precio nativo y el lead es el evento de conversión — la atribución es trivial. Algo menos repetible entre tipos de oferta.",
  "Highest moat, proven outperformance — but recruiting runs offline and slow. Enter as the supply layer inside health, not as vertical one.": "El mayor foso, rendimiento superior comprobado — pero el reclutamiento es fuera de línea y lento. Entrar como capa de oferta dentro de salud, no como vertical uno.",
  "30–50% splits standard, checkout attribution clean, launch-driven revenue is lumpy and refund-heavy. Underwrite on net-of-refunds.": "Repartos de 30–50% estándar, atribución de checkout limpia, ingresos por lanzamientos irregulares y con muchos reembolsos. Suscribir sobre neto de reembolsos.",
  "Enrollment cycle short enough to settle monthly; student creators are the ad. Fewer identical prospects per metro.": "Ciclo de inscripción lo bastante corto para liquidar mensualmente; los estudiantes creadores son el anuncio. Menos prospectos idénticos por ciudad.",
  "3x CPMs and buyers outnumber creators — but 60–90 day attribution windows and CRM-dependent tracking slow settlement.": "CPMs 3x y los compradores superan a los creadores — pero ventanas de atribución de 60–90 días y rastreo dependiente de CRM ralentizan la liquidación.",
  "Structural moat via Medellín, real spend gap — but it's a layer across verticals, not a vertical. Pair it with health.": "Foso estructural vía Medellín, brecha de inversión real — pero es una capa entre verticales, no un vertical. Combinar con salud.",
  "High-intent, pay-per-lead native — but lead-quality disputes make settlement contentious. Needs a dispute process before scale.": "Alta intención, pago por lead nativo — pero las disputas de calidad de leads hacen contenciosa la liquidación. Necesita un proceso de disputas antes de escalar.",
  "Highest rate on the board, but owned publishers must exist first. Vertical two or three, after the publisher bench is built.": "La tarifa más alta del tablero, pero los publishers propios deben existir primero. Vertical dos o tres, después de construir el banco de publishers.",
  "Best operating leverage — one system, hundreds of units — but multi-stakeholder sales and per-unit tracking setup slow the start.": "El mejor apalancamiento operativo — un sistema, cientos de unidades — pero las ventas con múltiples interesados y la configuración de rastreo por unidad ralentizan el inicio.",
  "Six-figure LTV but 6–18 month enrollment cycles break monthly settlement. Title IV compliance on every claim. Expansion vertical.": "LTV de seis cifras pero ciclos de inscripción de 6–18 meses rompen la liquidación mensual. Cumplimiento del Título IV en cada afirmación. Vertical de expansión.",
  "Brokers already take 30–50% — the rate is proven — but unit sales close over months and attribution is a handshake. Last.": "Los corredores ya toman 30–50% — la tarifa está probada — pero las ventas de unidades cierran en meses y la atribución es un apretón de manos. Al final.",
  "Extensive list — every market & rate": "Lista extensa — todos los mercados y tarifas",
  "AI sub-verticals": "Sub-verticales de IA",
  "GenAI was the fastest-growing UA category in 2026 (+47–53% YoY install spend). These buyers convert ads to subscriptions, tolerate $30–100 CPAs, and churn 36% faster than non-AI apps — so they need permanent creative refresh, not campaigns. Price on net retained revenue.": "GenAI fue la categoría de adquisición de mayor crecimiento en 2026 (+47–53% interanual en inversión de instalación). Estos compradores convierten anuncios en suscripciones, toleran CPAs de $30–100 y tienen churn 36% más rápido que las apps sin IA — necesitan renovación creativa permanente, no campañas. Cobrar sobre ingreso neto retenido.",
