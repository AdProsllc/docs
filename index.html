<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Scoped to search engines only; Anthropic bots (ClaudeBot, Claude-User, Claude-SearchBot) intentionally NOT listed so pages can be pulled into Claude chat. -->
<meta name="bingbot" content="noindex, nofollow">
<meta name="slurp" content="noindex, nofollow">
<meta name="duckduckbot" content="noindex, nofollow">
<meta name="baiduspider" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Published Pages — Ad Pros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #040735;
      --navy-card: #070b3d;
      --yellow: #F9D900;
      --blue: #1A6FD4;
      --white: #FFFFFF;
      --grey-300: #8A8B93;
      --grey-200: #B0B1B6;
      --card-border: #0e1358;
    }
    body { background: var(--navy); color: var(--grey-200); font-family: "Inter","Helvetica Neue",Arial,sans-serif; min-height: 100vh; }

    .ap-header { background: var(--navy); border-bottom: 4px solid var(--yellow); padding: 28px 48px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .ap-header-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.15); }
    .ap-header-text h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.3px; }
    .ap-header-text p { font-size: 13px; color: var(--grey-300); margin-top: 3px; }

    .ap-content { padding: 40px 48px; max-width: 1060px; margin: 0 auto; }

    /* Search */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--grey-300); pointer-events: none; }
    .search-input {
      width: 100%; padding: 16px 20px 16px 50px;
      background: var(--navy-card); border: 1px solid var(--card-border); border-radius: 12px;
      color: #fff; font-size: 16px; font-family: inherit; outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--yellow); }
    .search-input::placeholder { color: var(--grey-300); }

    /* Filter bar */
    .filter-bar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 24px; padding: 16px 20px;
      background: var(--navy-card); border: 1px solid var(--card-border); border-radius: 12px;
    }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-label { font-size: 13px; color: var(--grey-300); font-weight: 500; white-space: nowrap; }
    .filter-date {
      padding: 8px 12px; background: var(--navy); border: 1px solid var(--card-border); border-radius: 8px;
      color: #fff; font-size: 13px; font-family: inherit; outline: none; transition: border-color 0.2s;
      color-scheme: dark;
    }
    .filter-date:focus { border-color: var(--yellow); }
    .filter-sep { width: 1px; height: 28px; background: var(--card-border); flex-shrink: 0; }
    .sort-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; background: none; border: 1px solid var(--card-border); border-radius: 8px;
      color: var(--grey-200); font-size: 13px; font-family: inherit; font-weight: 500;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .sort-btn:hover { border-color: var(--yellow); color: #fff; }
    .sort-btn.active { border-color: var(--yellow); color: var(--yellow); }
    .sort-btn svg { width: 14px; height: 14px; transition: transform 0.2s; }
    .sort-btn.asc svg { transform: rotate(180deg); }
    .clear-btn {
      padding: 8px 14px; background: none; border: 1px solid var(--card-border); border-radius: 8px;
      color: var(--grey-300); font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all 0.2s; white-space: nowrap;
    }
    .clear-btn:hover { border-color: var(--grey-300); color: #fff; }
    .filter-spacer { flex: 1; }

    /* Stats bar */
    .stats-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .stats-count { font-size: 14px; color: var(--grey-300); }
    .stats-count strong { color: var(--yellow); font-weight: 600; }
    .refresh-btn {
      display: flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--card-border); border-radius: 8px;
      color: var(--grey-300); font-size: 13px; font-family: inherit;
      padding: 8px 14px; cursor: pointer; transition: all 0.2s;
    }
    .refresh-btn:hover { border-color: var(--grey-300); color: #fff; }
    .refresh-btn svg { width: 14px; height: 14px; }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Table header */
    .table-head {
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px 12px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.8px; color: var(--grey-300);
    }
    .table-head-title { flex: 1; min-width: 0; }
    .table-head-date { width: 140px; text-align: right; flex-shrink: 0; }
    .table-head-action { width: 32px; flex-shrink: 0; }

    /* Page cards */
    .page-card {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 24px; background: var(--navy-card);
      border: 1px solid var(--card-border); border-radius: 10px;
      margin-bottom: 8px; cursor: pointer; transition: all 0.2s;
      text-decoration: none; color: inherit;
    }
    .page-card:hover {
      border-color: var(--yellow);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(249, 217, 0, 0.06);
    }
    .page-card-info { flex: 1; min-width: 0; }
    .page-card-title { font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-card-url { font-size: 12px; color: var(--grey-300); font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-card-author { font-size: 11px; color: var(--grey-400, #54556A); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-card-author-name { color: var(--grey-300); font-weight: 500; }
    .page-card-date { width: 140px; text-align: right; flex-shrink: 0; font-size: 14px; font-weight: 500; color: var(--grey-200); white-space: nowrap; }
    .page-card-date-none { color: var(--grey-300); font-style: italic; font-weight: 400; font-size: 13px; }
    .page-card-arrow { width: 32px; text-align: center; flex-shrink: 0; color: var(--grey-300); font-size: 18px; transition: color 0.2s; line-height: 1; }
    .page-card:hover .page-card-arrow { color: var(--yellow); }

    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.6; } }
    .skeleton { height: 68px; background: var(--navy-card); border: 1px solid var(--card-border); border-radius: 10px; margin-bottom: 8px; animation: pulse 1.5s ease-in-out infinite; }

    .state-msg { text-align: center; padding: 48px 24px; color: var(--grey-300); font-size: 15px; }
    .retry-btn {
      margin-top: 16px; display: inline-block;
      padding: 10px 20px; background: var(--yellow); color: var(--navy);
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }

    .ap-footer { margin: 64px 48px 32px; padding-top: 24px; border-top: 1px solid var(--card-border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .ap-footer p { font-size: 12px; color: var(--grey-300); }

    @media (max-width: 768px) {
      .ap-header, .ap-content, .ap-footer { padding-left: 20px; padding-right: 20px; }
      .ap-content { padding-top: 28px; }
      .filter-bar { gap: 10px; padding: 14px 16px; }
      .filter-sep { display: none; }
      .filter-group { width: 100%; }
      .filter-group .filter-date { flex: 1; }
      .filter-spacer { display: none; }
      .page-card { flex-wrap: wrap; padding: 16px; gap: 10px; }
      .page-card-info { width: 100%; }
      .page-card-date { width: auto; text-align: left; }
      .page-card-arrow { width: auto; margin-left: auto; }
      .page-card-title { white-space: normal; }
      .table-head { display: none; }
    }
  </style>
</head>

    <p style="color:#B0B1B6;font-size:14px;margin-bottom:24px;">Enter the password to continue.</p>

    <button onclick="ap_check()"

<script>
(function(){
  var H="eec01e3d12195f67b579f4a31b329ef434cd60e18fe55cdc64f8d50cf7428d5d";
  var K="ap-ok-index";
  async function sha(s){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
  window.ap_check=async function(){
    var pw=document.getElementById('ap-pw').value;
    if(await sha(pw)===H){try{sessionStorage.setItem(K,'1');}catch(e){}reveal();}
    else{document.getElementById('ap-err').textContent='Incorrect password';}
  };
  function reveal(){
    var g=document.getElementById('ap-gate');if(g)g.style.display='none';
    var c=document.getElementById('ap-content');if(c){c.style.display='';window.dispatchEvent(new Event('ap-unlocked'));}
  }
  try{if(sessionStorage.getItem(K)==='1'){if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',reveal);}else{reveal();}}}catch(e){}
  setTimeout(function(){var p=document.getElementById('ap-pw');if(p)p.focus();},50);
})();
</script>

  <header class="ap-header">

<noscript>
  <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;color:#B0B1B6;text-align:center;padding:40px;">
    JavaScript is required to view this page.
  </div>
</noscript>

<script>
(function(){
  var API = 'https://api.github.com/repos/AdProsllc/docs';
  var CACHE_KEY = 'ap-pages-v5';
  var CACHE_TTL = 5 * 60 * 1000;

  var allPages = [];
  var searchTerm = '';
  var sortDesc = true;
  var dateFrom = '';
  var dateTo = '';

  var pageListEl = document.getElementById('page-list');
  var searchEl = document.getElementById('search-input');
  var statsEl = document.getElementById('stats-count');
  var refreshEl = document.getElementById('refresh-btn');
  var sortBtnEl = document.getElementById('sort-btn');
  var sortLabelEl = document.getElementById('sort-label');
  var filterFromEl = document.getElementById('filter-from');
  var filterToEl = document.getElementById('filter-to');
  var clearBtnEl = document.getElementById('clear-btn');

  /* Slug to readable title */
  var UPPER = {'ai':1,'sop':1,'tts':1,'ag1':1,'epc':1,'bie':1,'api':1,'hq':1,'v3':1,'v2':1,'v1':1,'url':1,'ui':1,'ux':1,'qa':1,'ceo':1,'cto':1,'coo':1,'cmo':1,'roi':1};
  function titleize(slug) {
    return slug.split('-').map(function(w) {
      if (UPPER[w]) return w.toUpperCase();
      if (/^\d+$/.test(w)) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  /* Return YYYY-MM-DD from an ISO date string */
  function toDateStr(iso) {
    if (!iso) return '';
    return iso.slice(0, 10);
  }

  /* DOM helpers */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function(k) {
        if (k === 'className') node.className = attrs[k];
        else if (k === 'textContent') node.textContent = attrs[k];
        else if (k === 'style' && typeof attrs[k] === 'object') {
          Object.keys(attrs[k]).forEach(function(s) { node.style[s] = attrs[k][s]; });
        }
        else node.setAttribute(k, attrs[k]);
      });
    }
    if (children) {
      children.forEach(function(c) {
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else if (c) node.appendChild(c);
      });
    }
    return node;
  }

  function clearEl(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  /* Cache */
  function getCache() {
    try {
      var raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (Date.now() - obj.ts > CACHE_TTL) return null;
      return obj.pages;
    } catch(e) { return null; }
  }
  function setCache(pages) {
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ pages: pages, ts: Date.now() })); } catch(e) {}
  }
  function clearCache() {
    try { sessionStorage.removeItem(CACHE_KEY); } catch(e) {}
  }

  /* Loading skeletons */
  function showLoading() {
    statsEl.textContent = 'Loading\u2026';
    clearEl(pageListEl);
    for (var i = 0; i < 5; i++) {
      var sk = el('div', { className: 'skeleton' });
      sk.style.animationDelay = (i * 0.1) + 's';
      pageListEl.appendChild(sk);
    }
  }

  /* Error state */
  function showError(msg) {
    statsEl.textContent = '';
    clearEl(pageListEl);
    var hint = (msg && msg.indexOf('403') !== -1)
      ? 'GitHub API rate limit reached. Try again in a minute.'
      : (msg || 'Failed to load pages.');
    var wrap = el('div', { className: 'state-msg' }, [
      el('p', { textContent: hint }),
      el('button', { className: 'retry-btn', textContent: 'Try Again' })
    ]);
    wrap.querySelector('.retry-btn').addEventListener('click', function() {
      clearCache();
      loadPages(false);
    });
    pageListEl.appendChild(wrap);
  }

  /* Build a single page card */
  function buildCard(page) {
    var infoChildren = [
      el('div', { className: 'page-card-title', textContent: page.title }),
      el('div', { className: 'page-card-url', textContent: 'docs.adpros.com' + page.url })
    ];
    if (page.author) {
      infoChildren.push(el('div', { className: 'page-card-author' }, [
        document.createTextNode('by '),
        el('span', { className: 'page-card-author-name', textContent: page.author })
      ]));
    }
    var info = el('div', { className: 'page-card-info' }, infoChildren);

    var dateEl;
    if (page.date) {
      dateEl = el('div', { className: 'page-card-date', textContent: fmtDate(page.date) });
    } else {
      dateEl = el('div', { className: 'page-card-date' }, [
        el('span', { className: 'page-card-date-none', textContent: 'No date' })
      ]);
    }

    var arrow = el('div', { className: 'page-card-arrow', textContent: '\u2192' });

    var card = el('a', {
      className: 'page-card',
      href: page.url,
      target: '_blank',
      rel: 'noopener'
    }, [info, dateEl, arrow]);
    return card;
  }

  /* Load pages from GitHub API */
  async function loadPages(useCache) {
    if (useCache) {
      var cached = getCache();
      if (cached) {
        allPages = cached;
        render();
        return;
      }
    }

    showLoading();
    refreshEl.classList.add('spinning');

    // Primary: read the static manifest (one request, never rate-limited).
    // The /publish skill regenerates pages.json on every publish so this is
    // always current. Fall back to the GitHub API only if the manifest is
    // missing or unreadable (e.g. during the brief moment after a clean repo
    // is set up but before the first publish).
    try {
      var res = await fetch('/pages.json?_=' + Date.now());
      if (res.ok) {
        var data = await res.json();
        var pages = (data && data.pages) || [];
        allPages = pages;
        setCache(pages);
        render();
        refreshEl.classList.remove('spinning');
        return;
      }
      // Non-OK — fall through to API fallback.
    } catch (e) { /* fall through */ }

    // Fallback: GitHub API (subject to anonymous 60 req/hour limit).
    try {
      var res2 = await fetch(API + '/contents/');
      if (!res2.ok) throw new Error('API ' + res2.status);
      var items = await res2.json();
      var dirs = items.filter(function(it) {
        return it.type === 'dir' && it.name.charAt(0) !== '.';
      });
      if (dirs.length === 0) {
        allPages = [];
        render();
        refreshEl.classList.remove('spinning');
        return;
      }
      // Use per_page=1 here for the fallback; we'd rather have the most-recent-edit
      // attribution than burn through the rate limit. The manifest path above is the
      // accurate one; this is only for resilience.
      var fallbackPages = await Promise.all(dirs.map(function(dir) {
        return fetch(API + '/commits?path=' + encodeURIComponent(dir.name) + '/index.html&per_page=1')
          .then(function(r) { return r.ok ? r.json() : []; })
          .then(function(commits) {
            var c = commits[0];
            return {
              slug: dir.name,
              title: titleize(dir.name),
              url: '/' + dir.name + '/',
              date: c ? c.commit.author.date : null,
              author: c ? c.commit.author.name : null
            };
          })
          .catch(function() {
            return { slug: dir.name, title: titleize(dir.name), url: '/' + dir.name + '/', date: null, author: null };
          });
      }));
      allPages = fallbackPages;
      setCache(fallbackPages);
      render();
    } catch(e) {
      showError(e.message);
    }

    refreshEl.classList.remove('spinning');
  }

  /* Sort and filter, then render */
  function render() {
    var filtered = allPages.slice();

    /* Text search — matches title, slug, or author */
    if (searchTerm) {
      var q = searchTerm.toLowerCase();
      filtered = filtered.filter(function(p) {
        return p.title.toLowerCase().indexOf(q) !== -1
          || p.slug.indexOf(q) !== -1
          || (p.author && p.author.toLowerCase().indexOf(q) !== -1);
      });
    }

    /* Date range filter */
    if (dateFrom) {
      filtered = filtered.filter(function(p) {
        return p.date && toDateStr(p.date) >= dateFrom;
      });
    }
    if (dateTo) {
      filtered = filtered.filter(function(p) {
        return p.date && toDateStr(p.date) <= dateTo;
      });
    }

    /* Sort */
    filtered.sort(function(a, b) {
      if (!a.date && !b.date) return a.title.localeCompare(b.title);
      if (!a.date) return 1;
      if (!b.date) return -1;
      var cmp = new Date(a.date) - new Date(b.date);
      return sortDesc ? -cmp : cmp;
    });

    /* Update sort button state */
    sortLabelEl.textContent = sortDesc ? 'Newest First' : 'Oldest First';
    if (sortDesc) {
      sortBtnEl.classList.remove('asc');
    } else {
      sortBtnEl.classList.add('asc');
    }

    /* Stats */
    clearEl(statsEl);
    var total = allPages.length;
    var shown = filtered.length;
    var hasFilters = searchTerm || dateFrom || dateTo;
    var countEl = el('strong', { textContent: String(shown) });
    if (hasFilters && shown !== total) {
      statsEl.appendChild(countEl);
      statsEl.appendChild(document.createTextNode(' of ' + total + ' pages'));
    } else {
      statsEl.appendChild(countEl);
      statsEl.appendChild(document.createTextNode(' page' + (total !== 1 ? 's' : '') + ' published'));
    }

    /* Cards */
    clearEl(pageListEl);

    if (allPages.length === 0) {
      pageListEl.appendChild(el('div', { className: 'state-msg' }, [
        el('p', { textContent: 'No pages published yet.' })
      ]));
      return;
    }

    if (filtered.length === 0) {
      pageListEl.appendChild(el('div', { className: 'state-msg' }, [
        el('p', { textContent: 'No pages match your filters.' })
      ]));
      return;
    }

    filtered.forEach(function(page) {
      pageListEl.appendChild(buildCard(page));
    });
  }

  /* Events */
  searchEl.addEventListener('input', function() {
    searchTerm = this.value.trim();
    render();
  });
  searchEl.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { this.value = ''; searchTerm = ''; render(); }
    if (e.key === 'Enter') {
      var first = pageListEl.querySelector('.page-card');
      if (first) window.open(first.getAttribute('href'), '_blank');
    }
  });

  filterFromEl.addEventListener('change', function() {
    dateFrom = this.value;
    render();
  });
  filterToEl.addEventListener('change', function() {
    dateTo = this.value;
    render();
  });

  sortBtnEl.addEventListener('click', function() {
    sortDesc = !sortDesc;
    render();
  });

  clearBtnEl.addEventListener('click', function() {
    searchEl.value = '';
    searchTerm = '';
    filterFromEl.value = '';
    filterToEl.value = '';
    dateFrom = '';
    dateTo = '';
    sortDesc = true;
    render();
  });

  refreshEl.addEventListener('click', function() {
    clearCache();
    loadPages(false);
  });

  /* Init after gate unlocks */
  function init() {
    var gate = document.getElementById('ap-gate');
    if (!gate || gate.style.display === 'none') {
      loadPages(true);
      searchEl.focus();
    } else {
      window.addEventListener('ap-unlocked', function() {
        loadPages(true);
        setTimeout(function() { searchEl.focus(); }, 100);
      });
    }
  }
  init();
})();
</script>
