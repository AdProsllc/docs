hat smells SO good in here?\"", "\"Did you know your house has a smell you can't smell anymore?\"", "\"What does your house smell like to everyone else?\" *(LP)*", "\"Why do your floors look worse after you clean them?\"", "\"What about Pine-Sol?\" / \"Okay, what about Fabuloso?\"", "\"Is this good for wood floors? Laminate?\" *(reply-to-comment)*", "\"Mopping before vacuuming?\"", "\"Do you think I'm charging enough, or should I go up on my prices?\" *(engagement bait)*", "\"Ready to level up your freshness game?\""]}]}, {"n": "18", "name": "Controversial Statements", "insight": "Provocations that stop the scroll and make the problem personal.", "flag": "", "groups": [{"label": "", "lines": ["\"Your house stank and you don't even know it.\"", "\"If your house smells like dog, garbage truck juice, and corn chips…\"", "\"Our scent is addictive.\"", "\"Everybody is nose-blind to their own house.\"", "\"Your floor cleaner is slowly destroying your $4,000 floors.\"", "\"You're not cleaning your floors — you're reapplying yesterday's dirt with today's water.\" *(LP)*", "\"This is the most powerful mop soap I've smelled in my entire life.\"", "\"The smell went up to my neighbor's apartment and she wants me to keep using it.\"", "Rating trusted household brands (Pine-Sol, Lysol) \"1 out of 10.\""]}]}, {"n": "19", "name": "Testimonials / Social Proof", "insight": "Named reviews + the recurring 'guests always ask' proof.", "flag": "", "groups": [{"label": "", "lines": ["\"Every single time someone walks into my house they ask…\"", "Neighbor-knocks-on-the-door story (asked what she cleans her floors with).", "Text-message-style testimonial screenshots; UGC \"I switched and never looked back.\"", "**Named LP reviews:** \"The moment I tried the Blyss scent I knew I was hooked.\" — Jessie R., LA · \"The scent is amazing and it actually works. My hardwood floors are streak-free.\" — Taylor S., Austin · \"Cuts through tracked-in mess without that sticky film… mopping actually feels faster.\" — Sarah M., San Diego · \"The Royalty scent is perfect and it cleans better than anything I've used.\" — David K., Seattle · \"Finally found a mop soap that doesn't leave residue. My tile floors look brand new.\" — Emily R., Chicago · \"Worth every penny. One bottle lasts forever.\" — James T., NYC.", "\"Built on Customer Love\" + \"10,000+ verified 5-star reviews.\""]}]}, {"n": "20", "name": "Facts", "insight": "Hard anchors: 10k reviews, pH 6.5–7, one bottle lasts weeks.", "flag": "", "groups": [{"label": "", "lines": ["10,000+ verified 5-star reviews.", "Plant-based, pH 6.5–7, non-toxic, zero residue.", "Safe for LVP, hardwood, tile, laminate & natural stone.", "Highly concentrated — one bottle lasts ~5+ weeks of weekly mopping.", "Nose blindness / olfactory adaptation: the brain stops registering a constant smell after ~20 minutes. *(LP)*", "14 scents available; six positioned as \"signature.\""]}]}, {"n": "21", "name": "Trust Factors", "insight": "Reviews, on-pack badges, and 'breaks the cycle' authority language.", "flag": "", "groups": [{"label": "", "lines": ["10,000+ 5-star reviews (across ~48 ads + every LP).", "\"Selling out like crazy\" / \"viral for a reason.\"", "On-pack badge lockup: \"Non-Toxic · Naturally Scented · Deep-Cleaning.\"", "\"Professional Standard for Clean Floors\" / \"Blyss Breaks the Cycle.\" *(LP)*", "Reviews link in site nav; verified-buyer tags on testimonials.", "Subscription with \"cancel anytime\" + 30-day guarantee as trust anchors."]}]}, {"n": "22", "name": "Origin Story", "insight": "Empty — the single biggest open lane. No founder 'why' anywhere.", "flag": "gap", "groups": [{"label": "", "lines": ["⚠️ **Still largely untapped.** No true founder / brand-origin narrative.", "Closest is a first-person discovery moment in the advertorial (Jessica Wilson byline: \"The first time I used it, I mopped on a Sunday night… Monday morning I stopped.\").", "Opportunity: a real \"why we built a non-toxic, scent-first mop soap\" never hedged.", "flag": "", "groups": [{"label": "", "lines": ["\"The best smelling house in 2025.\"", "\"This actually works.\"", "\"It's a 10/10 for me, easily.\"", "\"If I had to pick a favorite, it'd be Blue Lava or the seasonal scents — if you can get your hands on them.\"", "Confident, first-person, \"trust me\" endorsement tone throughout."]}]}, {"n": "27", "name": "Story", "insight": "POV skits, vacation returns, and the neighbor-knocks moment.", "flag": "", "groups": [{"label": "", "lines": ["\"We're on vacation in Orlando…\" lifestyle framing.", "A woman moving room to room — dining area, hallway, high surfaces, floors.", "Guest-reaction narrative (someone walks in, stops, asks about the smell).", "Neighbor knocks on the door: \"I thought she was mad — she just wanted to know what I clean my floors with.\"", "Roach-with-wings bit (\"nothing more terrifying… you go to get it and it takes off flying\").", "\"Things I got from the TikTok shop that I love / hate\" listicle.", "LP narrative arc: the vacation-return \"you could actually smell your house\" moment → nose-blindness science → the fix."]}]}, {"n": "28", "name": "CTA", "insight": "Shop now + stock-up + free-shipping nudge + official-site steer.", "flag": "", "groups": [{"label": "", "lines": ["\"Shop now.\" / \"Add to cart.\" / \"Proceed to checkout.\"", "\"Get in here.\" / \"You need this in your life.\"", "\"When I say run, I mean run and grab yours right now before it sells out again.\"", "\"Grab yours at the link and enjoy the best smelling home.\"", "\"Make sure you grab enough that you get the free shipping.\"", "\"Try it once for $0.00.\" / \"Build your bundle.\"", "\"Make sure you're getting it from the official website.\" *(anti-dupe steer)*"]}]}, {"n": "29", "name": "Recommendation", "insight": "Peer advice: 'you need this,' 'skip the candles.'", "flag": "", "groups": [{"label": "", "lines": ["\"You need this in your life.\"", "\"So if you want to be the best smelling house on the block, this is for you.\"", "\"Skip the extra candles and room sprays.\" *(LP)*", "\"Experience the professional standard for clean floors.\" *(LP)*", "Personal \"trust me, switch to this\" framing."]}]}, {"n": "30", "name": "PS (postscript)", "insight": "Missing — an easy advertorial/email add for urgency.", "flag": "gap", "groups": [{"label": "", "lines": ["⚠️ **Not surfaced.** No postscript block in any current script or advertorial.", "Easy add for the long-form pages, e.g. \"P.S. The sale ends soon and the Mist Spray keeps selling out — grab a bundle to lock in free shipping.\""]}]}, {"n": "31", "name": "Bonus / Offer Stack", "insight": "Bundle + subscribe stack engineered to raise cart size.", "flag": "", "groups": [{"label": "", "lines": ["Seasonal sales: 30–40% off across the line (Spring Cleaning, Summer, Fall, Black Friday 60%+).", "**Build-your-bundle tiers:** 1 bottle 13% off · 2 bottles 26% · 3 bottles 31% · 4+ bottles 36%.", "**Subscribe & Save:** ~$21.40/ea, refills every 30 days, cancel anytime; 2-month & 3-month \"Best Deal\" supply (up to $10 off per bottle).", "\"Try it Once for $0.00 /ea.\"", "Free shipping threshold; \"free samples and gifts\" with order.", "Companion add-ons: Blyss Mist Spray, Spin Mop Head Replacements.", "30-day guarantee attached to bundles."]}]}, {"n": "32", "name": "Pricing & Discounts", "insight": "Anchored discounts and a clean bundle ladder.", "flag": "", "groups": [{"label": "", "lines": ["Headlines: \"Up to 36% Off\" (workhorse) · \"Summer Sale up to 40%\" · \"Black Friday over 60%\" · \"Spring Cleaning Sale.\"", "Mop soap: from **$39–$49** regular; bundle per-bottle from **$34 → $25** (1→4+ bottles); subscription **$22.30 → $21.40/ea**.", "Companions: Spin Mop Heads 4-pack $24.99 (reg $39.99) · 8-pack $34.99 (reg $49.99) · Mist Spray $11.99 (reg $19.99).", "\"Save 36% + Free Shipping\" is the standing LP offer."]}]}]</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var deck=document.getElementById('deck');

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(s){ s=esc(s);
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/\*(.+?)\*/g,'<span class="note">$1</span>');
    return s; }
  function isWarn(s){return s.indexOf('⚠️')===0;}

  var slides=[]; // {label}
  function addSlide(html,label,center){
    var el=document.createElement('section');
    el.className='slide'+(center?' slide--center':'');
    el.innerHTML=html; deck.appendChild(el); slides.push({label:label});
  }

  // Cover
  addSlide(
    '<div class="kicker">Deep Dive · 32 Dimensions</div>'+
    '<h1>Blyss Aroma <br><span style="font-size:.46em;font-weight:800;color:var(--blue-light);letter-spacing:.5px;">Deep Dive</span></h1>'+
    '<p class="lede" style="margin-top:20px;max-width:24ch">The full messaging teardown — <span class="hl">one dimension per slide</span>, every real line from 143 ads &amp; 3 landing pages.</p>'+
    '<p class="lede" style="margin-top:16px;font-size:14px;color:var(--g300)">Tap the bar below to jump to any dimension. Last slide is the entire library, unedited.</p>',
    'Cover', true);

  // Dimension slides
  D.forEach(function(d){
    var groups=d.groups.map(function(g){
      var lis=g.lines.map(function(l){return '<li class="'+(isWarn(l)?'warn':'')+'">'+fmt(l)+'</li>';}).join('');
      var lab=g.label?('<div class="grp__label">'+esc(g.label)+'</div>'):'';
      return '<div class="grp">'+lab+'<ul class="lines">'+lis+'</ul></div>';
    }).join('');
    var flag=d.flag?('<span class="flag '+d.flag+'">'+(d.flag==='gap'?'gap':'was gap')+'</span>'):'';
    addSlide(
      '<div class="kicker '+(d.flag==='gap'?'gap':'')+'">Dimension '+d.n+' / 32</div>'+
      '<h2>'+esc(d.name)+flag+'</h2>'+
      '<div class="insight '+(d.flag==='gap'?'gap':'')+'">'+fmt(d.insight)+'</div>'+
      groups,
      d.n+' · '+d.name, false);
  });

  // Infinite library page
  var lib='<div class="kicker">The Full Library</div><div class="lib__intro"><h2>Everything, unedited.</h2>'+
    '<p class="lede" style="margin-top:12px;font-size:15px;color:var(--g200)">All 32 dimensions in one scroll — the complete swipe corpus behind the read-out.</p></div>';
  D.forEach(function(d){
    var lis=d.groups.map(function(g){
      var inner=g.lines.map(function(l){return '<li class="'+(isWarn(l)?'warn':'')+'">'+fmt(l)+'</li>';}).join('');
      var lab=g.label?('<div class="grp__label">'+esc(g.label)+'</div>'):'';
      return lab+'<ul class="lines">'+inner+'</ul>';
    }).join('');
    lib+='<div class="lib__block" id="lib-'+d.n+'"><div class="lib__h"><span class="n">'+d.n+'</span><span class="nm">'+esc(d.name)+'</span></div>'+
      '<div class="lib__ins">'+fmt(d.insight)+'</div>'+lis+'</div>';
  });
  addSlide(lib,'Full Library', false);

  // Nav
  var n=slides.length,cur=0,rail=document.getElementById('rail'),
      prev=document.getElementById('prev'),next=document.getElementById('next'),
      pos=document.getElementById('pos'),lbl=document.getElementById('lbl'),
      hint=document.getElementById('hint'),topright=document.getElementById('topright');
  function go(i){i=Math.max(0,Math.min(n-1,i));deck.scrollTo({left:i*deck.clientWidth,behavior:'smooth'});}
  function update(){
    var i=Math.round(deck.scrollLeft/deck.clientWidth); if(i!==cur)cur=i;
    rail.style.width=(cur/(n-1)*100)+'%';
    pos.textContent=String(cur+1).padStart(2,'0');
    lbl.textContent=slides[cur].label;
    prev.disabled=cur===0;next.disabled=cur===n-1;
    topright.textContent=(cur===0)?'DEEP DIVE':(cur===n-1?'LIBRARY':(cur)+' / 32');
    if(cur>0)hint.style.display='none';
  }
  deck.addEventListener('scroll',function(){requestAnimationFrame(update);},{passive:true});
  prev.onclick=function(){go(cur-1);};next.onclick=function(){go(cur+1);};
  document.addEventListener('keydown',function(e){
    if(document.getElementById('index').classList.contains('open')){if(e.key==='Escape')closeIdx();return;}
    if(e.key==='ArrowRight'){e.preventDefault();go(cur+1);}
    if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
    if(e.key==='Home'){e.preventDefault();go(0);}
    if(e.key==='End'){e.preventDefault();go(n-1);}
  });
  window.addEventListener('resize',function(){deck.scrollLeft=cur*deck.clientWidth;});

  // Index overlay
  var index=document.getElementById('index'),grid=document.getElementById('idxGrid');
  D.forEach(function(d,di){
    var b=document.createElement('button');b.className='index__item';
    var mini=d.flag?('<span class="mini '+d.flag+'">'+(d.flag==='gap'?'gap':'fixed')+'</span>'):'';
    b.innerHTML='<span class="n">'+d.n+'</span><span>'+d.name+'</span>'+mini;
    b.onclick=function(){closeIdx();go(di+1);};grid.appendChild(b);
  });
  var libBtn=document.createElement('button');libBtn.className='index__item special';
  libBtn.innerHTML='<span class="n">∞</span><span>Full Library (all text)</span>';
  libBtn.onclick=function(){closeIdx();go(n-1);};grid.appendChild(libBtn);
  function openIdx(){index.classList.add('open');}
  function closeIdx(){index.classList.remove('open');}
  document.getElementById('jump').onclick=openIdx;
  document.getElementById('idxClose').onclick=closeIdx;
  index.addEventListener('click',function(e){if(e.target===index)closeIdx();});

  update();
})();
</script>
