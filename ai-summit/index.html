<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a12;
    --bg-card: #12121c;
    --bg-elev: #1a1a28;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.16);
    --text: #f5f5f7;
    --text-dim: #8a8a99;
    --text-faint: #5a5a6a;
    --purple: #7c3aed;
    --purple-bright: #a855f7;
    --blue: #2563eb;
    --orange: #f97316;
    --yellow: #fbbf24;
    --pink: #ec4899;
    --green: #10b981;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,58,237,0.18), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 50%, rgba(249,115,22,0.08), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* HEADER */
  .header {
    padding: 20px 20px 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 14px;
  }
  .brand-logo {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .brand-logo .dot { color: var(--orange); }
  .brand-sub {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .title-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 0.95;
    letter-spacing: -0.01em;
  }
  h1 em { color: var(--orange); font-style: italic; }
  .location {
    font-size: 11px;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.4;
  }
  .location strong { color: var(--text); display: block; font-weight: 500; }

  /* DAY TABS */
  .day-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 16px 20px 12px;
    position: sticky;
    top: 116px;
    z-index: 40;
    background: rgba(10,10,18,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .day-tab {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px;
    color: var(--text-dim);
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .day-tab .day-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: block;
    margin-bottom: 2px;
  }
  .day-tab .day-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .day-tab.active {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    border-color: transparent;
    color: rgba(255,255,255,0.85);
  }
  .day-tab.active .day-name { color: white; }
  .day-tab.active .day-num { color: rgba(255,255,255,0.75); }

  /* TRACK TABS - 4 options */
  .track-tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin: 0 20px 16px;
  }
  .track-tab {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 6px;
    color: var(--text-dim);
    font-family: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .track-tab .track-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    transition: transform 0.2s ease;
  }
  .track-tab .track-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .track-tab.active {
    background: var(--bg-elev);
    color: var(--text);
    border-color: var(--border-strong);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .track-tab.active .track-dot {
    transform: scale(1.3);
    box-shadow: 0 0 12px currentColor;
  }
  .track-tab[data-track="main"].active { background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(91,33,182,0.15)); border-color: rgba(168,85,247,0.4); }
  .track-tab[data-track="industry"].active { background: linear-gradient(135deg, rgba(37,99,235,0.25), rgba(30,64,175,0.15)); border-color: rgba(96,165,250,0.4); }
  .track-tab[data-track="workshops"].active { background: linear-gradient(135deg, rgba(249,115,22,0.25), rgba(194,65,12,0.15)); border-color: rgba(249,115,22,0.4); }
  .track-tab[data-track="master"].active { background: linear-gradient(135deg, rgba(251,191,36,0.2), rgba(180,135,20,0.1)); border-color: rgba(251,191,36,0.4); }
  .track-tab:active { transform: scale(0.97); }

  /* AGENDA */
  .agenda {
    padding: 4px 20px 80px;
  }
  .session {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 14px;
    position: relative;
    transition: all 0.2s ease;
  }
  .session.lunch {
    background: linear-gradient(90deg, rgba(249,115,22,0.15), rgba(124,58,237,0.15));
    border-color: rgba(249,115,22,0.3);
    grid-template-columns: 1fr;
    text-align: center;
    padding: 14px;
  }
  .session.lunch .lunch-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--orange);
  }
  .session.cocktail {
    background: linear-gradient(90deg, var(--orange), var(--purple-bright));
    border-color: transparent;
    grid-template-columns: 1fr;
    text-align: center;
    padding: 16px;
    color: white;
  }
  .session.cocktail .cocktail-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: white;
  }
  .session.cocktail .cocktail-time {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  .time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    line-height: 1.3;
    color: var(--text-dim);
    padding-top: 2px;
  }
  .time .start { color: var(--text); display: block; font-weight: 600; }
  .time .end { color: var(--text-faint); }
  .time .lang-tag {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 6px;
    border: 1px solid var(--orange);
    border-radius: 4px;
    color: var(--orange);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
  }

  .session-body { min-width: 0; }
  .session-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    letter-spacing: -0.005em;
    margin-bottom: 8px;
  }
  .speakers {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .speaker {
    font-size: 11px;
    line-height: 1.3;
    padding: 4px 8px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
  }
  .speaker .name { color: var(--text); font-weight: 500; }
  .speaker .company {
    font-style: italic;
    opacity: 0.7;
    margin-left: 4px;
  }

  /* track accent bar */
  .session::before {
    content: '';
    position: absolute;
    left: -1px;
    top: 16px;
    bottom: 16px;
    width: 3px;
    border-radius: 0 3px 3px 0;
    opacity: 0.8;
  }
  .session[data-track="main"]::before { background: var(--purple); }
  .session[data-track="industry"]::before { background: var(--blue); }
  .session[data-track="workshops"]::before { background: var(--orange); }
  .session[data-track="master"]::before { background: var(--yellow); }
  .session.lunch::before, .session.cocktail::before { display: none; }

  /* EMPTY/FADE */
  .session-list { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* track-specific subtle borders */
  .track-section-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .track-section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
  }

  /* Footer note */
  .footer-note {
    text-align: center;
    padding: 24px 20px 40px;
    color: var(--text-faint);
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
  }

  /* small interaction */
  .day-tab:active, .track-btn:active { transform: scale(0.98); }
  .session:active { background: var(--bg-elev); }
</style>
</head>

let state = {
  day: 'thu',
  track: 'main'
};

function render() {
  const list = document.getElementById('sessionList');
  const sectionLabel = document.getElementById('sectionLabel');
  const tk = state.track;
  const trackData = data[state.day][tk];
  const labelMap = {
    main: 'Main Stage',
    industry: 'Industry Stage',
    workshops: 'Workshops',
    master: 'Master Classes'
  };
  sectionLabel.textContent = labelMap[tk];
  sectionLabel.style.color = {
    main: 'var(--purple-bright)',
    industry: '#60a5fa',
    workshops: 'var(--orange)',
    master: 'var(--yellow)'
  }[tk];

  let html = '';
  trackData.sessions.forEach(s => {
    if (s.lunch) {
      html += `<div class="session lunch"><div><span class="lunch-label">ALMUERZO</span></div></div>`;
      return;
    }
    if (s.cocktail) {
      html += `<div class="session cocktail"><div><span class="cocktail-label">CÓCTEL AI NIGHT</span><div class="cocktail-time">${s.time[0]} PM →</div></div></div>`;
      return;
    }
    const speakers = (s.speakers || []).map(sp =>
      `<div class="speaker"><span class="name">${sp.n}</span>${sp.c ? `<span class="company">· ${sp.c}</span>` : ''}</div>`
    ).join('');
    html += `
      <div class="session" data-track="${tk}">
        <div class="time">
          <span class="start">${s.time[0]}</span>
          <span class="end">${s.time[1]}</span>
          ${s.lang ? `<span class="lang-tag">${s.lang}</span>` : ''}
        </div>
        <div class="session-body">
          <div class="session-title">${s.title}</div>
          <div class="speakers">${speakers}</div>
        </div>
      </div>`;
  });
  list.innerHTML = html;
  list.style.animation = 'none';
  list.offsetHeight;
  list.style.animation = '';
}

// Day tabs
document.querySelectorAll('.day-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.day-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.day = tab.dataset.day;
    render();
  });
});

// Track tabs
document.querySelectorAll('.track-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.track-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    state.track = btn.dataset.track;
    render();
  });
});

render();
</script>
